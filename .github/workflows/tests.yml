# Runs automatically on every push and pull request.
# Job 1 runs the tests on Windows and Linux. Job 2 scans the samples and keeps
# the HTML report as a downloadable file (an "artifact") on the Actions page.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: python -m pytest -v

  sample-report:
    name: Scan the samples and save the report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e .
      - name: Scan
        run: pqc-scan samples --quiet --html reports/report.html --json reports/report.json --csv reports/report.csv
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: pqc-report
          path: reports/
